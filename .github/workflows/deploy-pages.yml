name: Deploy to GitHub Pages

# 每次推送到 main 分支时，测试通过后只发布前端资源到 GitHub Pages。
# 纯静态托管：前端在拿不到 /api 后端时会自动回退到 data/*.js 内置数据，
# 因此浏览灵感库、做海报、用艺术工具都可正常工作（写操作需另接后端）。
on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages 部署所需的最小权限集合。
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，新推送会取消进行中的旧部署。
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check frontend and backend
        run: npm run check

      - name: Prepare static site
        run: |
          mkdir _site
          cp index.html .nojekyll _site/
          cp -R css js data assets vendor _site/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 与 Node 静态服务保持一致：后端、测试和配置文件不进入站点。
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
